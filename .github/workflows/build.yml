# Compila el APK automáticamente en GitHub (sin instalar nada en tu ordenador).
# Sube este proyecto a un repositorio de GitHub y ve a la pestaña "Actions":
# el APK aparece como "LeeTuAgenda-apk" al terminar.
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LeeTuAgenda-apk
          path: app/build/outputs/apk/debug/app-debug.apk
