# Compila el APK firmado en cada cambio y lo publica en "Releases".
# La clave de firma está en Settings → Secrets and variables → Actions (nunca en el código):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secrets de firma (SIGNING_KEYSTORE_BASE64...). Ver README."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk LeeTuAgenda.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LeeTuAgenda-apk
          path: LeeTuAgenda.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version LeeTuAgenda.apk \
            --title "Lee tu agenda (última versión)" \
            --notes "APK compilado automáticamente desde el commit ${GITHUB_SHA::7}. Descárgalo desde el móvil e instálalo." \
            --latest
