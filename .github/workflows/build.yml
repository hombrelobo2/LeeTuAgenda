# Compila el APK automáticamente en GitHub en cada cambio.
# Se publica en la sección "Releases" del repositorio (descarga directa desde el móvil).
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk LeeTuAgenda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeeTuAgenda-apk
          path: LeeTuAgenda.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version LeeTuAgenda.apk \
            --title "Lee tu agenda (última versión)" \
            --notes "APK compilado automáticamente desde el commit ${GITHUB_SHA::7}. Descárgalo desde el móvil e instálalo." \
            --latest
